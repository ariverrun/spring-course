spring:
  datasource:
    url: jdbc:h2:mem:testdb
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration, classpath:db/fixtures

resilience4j:
  retry:
    retry-aspect-order: 2
    instances:
      authorService:
        maxAttempts: 3
        waitDuration: 10ms
      bookService:
        maxAttempts: 3
        waitDuration: 10ms
      commentService:
        maxAttempts: 3
        waitDuration: 10ms
      genreService:
        maxAttempts: 3
        waitDuration: 10ms

  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      authorService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 1s
      bookService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 1s
      commentService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 1s
      genreService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 1s
